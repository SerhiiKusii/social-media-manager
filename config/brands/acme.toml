# Per-brand config. Committed (no secrets). Secrets resolve via env as
# IG_ACCESS_TOKEN__ACME with unsuffixed IG_ACCESS_TOKEN as fallback.

[brand]
id = "acme"
name = "Acme"
product_brief = """
Replace with a real product brief: what Acme sells, who it's for, tone of
voice, and the single most important thing every video should communicate.
"""
palette = ["#111111", "#F5F5F5", "#FF5A1F"]
hashtags = ["#acme"]

[accounts]
instagram_business_account_id_env = "IG_BUSINESS_ACCOUNT_ID__ACME"

[posting_windows]
# 24h local time windows the publisher is allowed to post within.
windows = ["09:00-11:00", "17:00-20:00"]
timezone = "Europe/Kyiv"

[sources]
# Accounts / hashtags to monitor for trend-jacking candidates.
# A non-empty list is what makes ingest run at all; in the default
# fixture mode the value is ignored and tests/fixtures/apify/tiktok.json
# is replayed instead, so this placeholder is what lets the quickstart
# produce queued items offline. Replace with real handles for live mode.
tiktok_seed_accounts = ["testaccount"]
instagram_seed_hashtags = ["footballtiktok", "footballskills", "football"]

[intro]
# Branded lead-in prepended to every render. The image is picked from the
# asset library by tag, so it goes through the same licence gate as any
# other on-screen media. Titles rotate per (item, revision).
enabled = true
image_tag = "carlos"
titles = ["Carlos approves it", "Carlos is watching it", "Carlos loves it"]
# The spoken line is the title itself, so the viewer hears what they read.
voiceover_from_title = true
duration_secs = 5.0

[broll]
# Background footage tag. These are Pexels clips fetched via
# `trendstealer assets fetch-pexels` -- never scraped video.
# count is how many *distinct* clips are used; the renderer tiles them to
# cover the whole body, so raising it buys variety rather than length.
tag = "football"
count = 3

[script]
# Target spoken length of the body voiceover, which drives the composition
# duration -- so this is effectively the Reel's length minus the intro.
min_secs = 15
max_secs = 20

[virality]
# Overrides for config/app.toml [virality]; omit keys to inherit global default.

[publish]
# Overrides for config/app.toml [publish]; omit keys to inherit global default.
