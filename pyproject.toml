[project]
name = "trendstealer"
version = "0.1.0"
description = "Trend-jacking content pipeline: scrape -> synthesize -> render -> human review -> publish"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.116",
  "apify-client>=1.9",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "faster-whisper>=1.0",
  "piper-tts>=1.2",
  "httpx>=0.27",
  "tenacity>=8.5",
  "typer>=0.12",
  "structlog>=24.4",
  "flask>=3.0",
  "flask-wtf>=1.2",
  "waitress>=3.0",
  "soundfile>=0.12",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "freezegun>=1.5",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
trendstealer = "trendstealer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trendstealer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: full render / live-network tests, excluded by default",
]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["video-renderer"]

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "piper.*", "flask_wtf.*", "waitress.*"]
ignore_missing_imports = true
